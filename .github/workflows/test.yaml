name: Run tests.

on:
  push:
    branches:
      - '*'
env:
  CARGO_TERM_COLOR: always
jobs:
  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install python3 python3-pip
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Create virtual environment with needed dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip3 install -r requirements.txt
      - name: Run tests
        run: |
          source .venv/bin/activate
          # make rltbl_load
          make test_linkml_validation
          make test_linkml_json_validation
          # This one should be run last, since it modifies files that are used as input to
          # some of the above tests.
          make test_linkml2valve
